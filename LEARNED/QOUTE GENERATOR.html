<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: rgb(234, 198, 150);
    }

    button {
      border-radius: 50px;
      background-color: rgb(217, 218, 139);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .my-box {
      width: 400px;
      min-height: 120px;
      background-color: rgb(217, 218, 139);
      padding: 20px;
      margin: 10px;
      border: dotted rgb(238, 166, 89);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #qoute {
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      font-size: 18px;
      text-align: center;
      padding: 10px;
      margin: 0;
    }

    #author {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      font-style: italic;
      text-align: center;
      margin: 5px 0 0 0;
    }
  </style>
</head>

<body>

  <button id="btn"><strong>✨ CLICK HERE FOR QUOTE</strong></button>

  <div class="my-box">
    <p id="qoute">Click the button to get a quote</p>
    <p id="author">—</p>
  </div>

  <script>
    // Quotes Array
    let quotes = [
      { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
      { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
      { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
      { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
      { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
      { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
      { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
      { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
      { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis" },
      { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" }
    ];

    // Elements select karo
    let qouteDisplay = document.getElementById('qoute');
    let authorDisplay = document.getElementById('author');
    let button = document.getElementById('btn');

    // Random quote show karne ka function
    function showRandomQuote() {
      let randomIndex = Math.floor(Math.random() * quotes.length);
      let selectedQuote = quotes[randomIndex];
      qouteDisplay.textContent = selectedQuote.text;
      authorDisplay.textContent = "— " + selectedQuote.author;
    }

    // Click event
    button.addEventListener('click', showRandomQuote);

    // Keydown event (Enter key)
    button.addEventListener('keydown', function (event) {
      if (event.key === "Enter") {
        showRandomQuote();
      }
    });

    // Pehli baar ek random quote dikhao
    showRandomQuote();
  </script>

</body>

</html>
