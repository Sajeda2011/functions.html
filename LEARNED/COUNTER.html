<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>counter app</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #area {
      height: 500px;
      width: 500px;
      background-color: aquamarine;
      color: black;
    }

    #btn {
      background-color: aqua;
      padding: 20px;
      font-family: 'Times New Roman', Times, serif;
      border-radius: 30px;
      border-color: rgb(15, 139, 139);
      font-weight: bold;
      width: 500px;
      margin-top: 10px;
    }

    .in {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;

    }

    #area {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 200px;

    }
  </style>
</head>

<body>
  <div class="in">
    <button id="btn">
      Increase
    </button>

    <p id="area"></p>
  </div>
  <script>
    var count = 0;
    var btn = document.getElementById("btn")
    var area = document.getElementById("area")


    btn.addEventListener('click', function () {

      if (count >= 10) {
        // newCount.textContent("limit exceed")
        area.textContent = "user you can no longer exceed"
        return;
      }

      // if (count >= 10) {
      //   btn.diabled = true;
      //   return;
      // }

      count = count + 1;
      area.textContent = count;

    });
















  </script>
</body>

</html>
